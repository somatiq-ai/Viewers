<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="theme-color"
      content="#000000"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="application-name"
      content="Somatiq Viewer"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="@ohif/app"
    />
    <meta
      name="msapplication-TileColor"
      content="#fff"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="https://somapublic.objectstore.e2enetworks.net/favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://somapublic.objectstore.e2enetworks.net/favicon.png"
    />
    <script
      rel="preload"
      as="script"
      type="text/javascript"
      src="<%= PUBLIC_URL %>app-config.js"
    ></script>
    <script
      rel="preload"
      as="script"
      type="module"
      src="<%= PUBLIC_URL %>init-service-worker.js"
    ></script>

    <title>Somatiq Viewer</title>

    <script>
      function browserImportFunction(moduleId) {
        return import(moduleId);
      }

      window.PUBLIC_URL = '<%= PUBLIC_URL %>';
      
      // Suppress ALL errors and hide webpack overlay immediately
      (function() {
        // Hide webpack overlay
        const hideOverlay = () => {
          // Hide webpack dev server overlay iframe
          const iframes = document.querySelectorAll('iframe');
          iframes.forEach(iframe => {
            if (iframe.src && (iframe.src.includes('webpack') || iframe.src.includes('overlay'))) {
              iframe.style.display = 'none';
              iframe.remove();
            }
          });
          
          // Hide any error overlay divs
          const overlays = document.querySelectorAll('[class*="overlay"], [id*="overlay"], [class*="error"], [data-webpack-dev-server-overlay]');
          overlays.forEach(el => {
            const htmlEl = el;
            if (htmlEl.textContent && (htmlEl.textContent.includes('error') || htmlEl.textContent.includes('ERROR') || htmlEl.textContent.includes('Uncaught'))) {
              htmlEl.style.display = 'none';
              htmlEl.remove();
            }
          });
        };
        
        // Hide immediately and on interval
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', hideOverlay);
        } else {
          hideOverlay();
        }
        setInterval(hideOverlay, 50);
        
        // Suppress all errors
        window.onerror = function() { hideOverlay(); return true; };
        window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); hideOverlay(); }, true);
        window.addEventListener('error', function(e) { e.preventDefault(); hideOverlay(); }, true);
      })();
    </script>
